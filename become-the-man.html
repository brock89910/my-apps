<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Become The Man</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; color: #e8e4dc; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
#hdr { flex-shrink: 0; background: #111; border-bottom: 1px solid #333; padding: 50px 16px 12px; display: flex; justify-content: space-between; align-items: center; }
#hdr h1 { color: #d4a853; font-size: 20px; font-weight: 800; }
#streak { color: #d4a853; font-size: 13px; background: #1a0f00; border: 1px solid #a07830; padding: 4px 10px; border-radius: 20px; }
#main { flex: 1; overflow-y: auto; }
#tabs { flex-shrink: 0; background: #111; border-top: 1px solid #333; display: flex; padding-bottom: env(safe-area-inset-bottom); }
.tab { flex: 1; background: none; border: none; color: #555; font-size: 10px; padding: 10px 2px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tab .ti { font-size: 20px; line-height: 1; }
.tab.on { color: #d4a853; }
.pg { display: none; padding: 0 0 20px 0; }
.pg.on { display: block; }
.sec { font-size: 11px; font-weight: 700; letter-spacing: 3px; color: #555; padding: 16px 16px 8px; text-transform: uppercase; }
.dnav { margin: 0 16px 10px; background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; }
.darr { background: none; border: none; color: #d4a853; font-size: 28px; padding: 0 8px; cursor: pointer; line-height: 1; }
.dlbl { font-size: 13px; }
.dtbtn { background: #1a0f00; border: 1px solid #a07830; color: #d4a853; font-size: 11px; padding: 4px 10px; border-radius: 8px; cursor: pointer; }
.ring-row { margin: 0 16px 12px; background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
.rw { width: 54px; height: 54px; flex-shrink: 0; position: relative; }
.rw svg { transform: rotate(-90deg); display: block; }
.rpct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #d4a853; pointer-events: none; }
.rinfo .rt { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #888; text-transform: uppercase; }
.rinfo .rc { font-size: 14px; margin-top: 4px; }
.cc { margin: 0 16px 10px; background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; overflow: hidden; }
.cc.gold { border-color: #a07830; }
.chdr { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; cursor: pointer; user-select: none; background: none; border: none; width: 100%; color: inherit; text-align: left; }
.cleft { display: flex; align-items: center; gap: 10px; }
.ci { font-size: 18px; }
.cn { font-size: 15px; font-weight: 700; }
.cright { display: flex; align-items: center; gap: 8px; }
.cpg { font-size: 12px; color: #888; }
.chv { color: #555; font-size: 12px; transition: transform 0.2s; }
.cc.open .chv { transform: rotate(180deg); }
.pb { height: 2px; background: #2a2a2a; margin: 0 16px; }
.pf { height: 100%; background: #d4a853; }
.hl { display: none; border-top: 1px solid #222; margin-top: 8px; padding: 4px 0 8px; }
.cc.open .hl { display: block; }
.hr { display: flex; align-items: center; gap: 12px; padding: 9px 16px; cursor: pointer; user-select: none; }
.hb { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.hb.on { background: #d4a853; border-color: #d4a853; }
.hb.on::after { content: "✓"; color: #000; font-size: 13px; font-weight: 800; }
.ht { font-size: 14px; line-height: 1.4; }
.ht.done { color: #555; text-decoration: line-through; }
.pc { margin: 0 16px 10px; background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; overflow: hidden; }
.phdr { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; cursor: pointer; user-select: none; background: none; border: none; width: 100%; color: inherit; text-align: left; }
.plbl { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #d4a853; text-transform: uppercase; }
.pbdy { display: none; padding: 12px 16px 14px; border-top: 1px solid #222; }
.pc.open .pbdy { display: block; }
.pq { font-size: 13px; color: #888; font-style: italic; margin-bottom: 8px; line-height: 1.5; }
textarea { width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; color: #e8e4dc; font-family: -apple-system, sans-serif; font-size: 14px; line-height: 1.6; padding: 11px; resize: none; min-height: 90px; outline: none; display: block; -webkit-appearance: none; }
textarea:focus { border-color: #a07830; }
textarea::placeholder { color: #444; }
.sind { font-size: 11px; color: #555; text-align: right; margin-top: 4px; }
.sind.ok { color: #4caf50; }
.tadd { display: flex; gap: 8px; margin: 0 16px 8px; }
.tadd input { flex: 1; background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; color: #e8e4dc; font-family: -apple-system, sans-serif; font-size: 14px; padding: 10px 13px; outline: none; -webkit-appearance: none; }
.tadd input::placeholder { color: #444; }
.abtn { background: #d4a853; border: none; border-radius: 10px; color: #000; font-size: 26px; font-weight: 700; width: 44px; cursor: pointer; }
.psel { display: block; width: calc(100% - 32px); margin: 0 16px 8px; background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; color: #888; font-size: 13px; padding: 9px 12px; outline: none; -webkit-appearance: none; }
.frow { display: flex; gap: 7px; padding: 0 16px 10px; overflow-x: auto; }
.chip { background: #161616; border: 1px solid #2a2a2a; border-radius: 20px; color: #888; font-size: 12px; padding: 5px 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; user-select: none; }
.chip.on { background: #1a0f00; border-color: #a07830; color: #d4a853; }
.ti2 { display: flex; align-items: flex-start; gap: 11px; padding: 12px 14px; margin: 0 16px 8px; background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; }
.ti2.done { opacity: 0.45; }
.tck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #333; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-top: 1px; }
.tck.on { background: #4caf50; border-color: #4caf50; }
.tck.on::after { content: "✓"; color: #fff; font-size: 12px; font-weight: 700; }
.tb2 { flex: 1; min-width: 0; }
.tt { font-size: 14px; line-height: 1.4; }
.tt.done { text-decoration: line-through; color: #555; }
.tm { font-size: 11px; color: #555; margin-top: 3px; }
.tdel { background: none; border: none; color: #444; font-size: 18px; cursor: pointer; padding: 0 4px; }
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 16px 10px; }
.wcard { background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; padding: 13px; }
.wlbl { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #555; text-transform: uppercase; margin-bottom: 6px; }
.wrow2 { display: flex; align-items: center; gap: 6px; }
.win { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #e8e4dc; font-size: 18px; padding: 8px; outline: none; width: 100%; -webkit-appearance: none; }
.wunit { font-size: 12px; color: #555; }
.lbtn { display: block; width: calc(100% - 32px); margin: 0 16px 12px; background: #d4a853; border: none; border-radius: 10px; color: #000; font-size: 15px; font-weight: 700; padding: 13px; cursor: pointer; text-transform: uppercase; }
.cwrap { margin: 0 16px 12px; background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; padding: 14px; }
.cttl { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #555; text-transform: uppercase; margin-bottom: 10px; }
.fhr { display: flex; justify-content: space-between; padding: 9px 16px; border-bottom: 1px solid #1a1a1a; font-size: 12px; color: #888; }
.fhr:last-child { border-bottom: none; }
.rc2 { margin: 0 16px 10px; background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; overflow: hidden; }
.rhdr { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; cursor: pointer; user-select: none; background: none; border: none; width: 100%; color: inherit; text-align: left; }
.rcs { font-size: 14px; font-weight: 700; }
.rbdg { font-size: 11px; background: #1a1a1a; border: 1px solid #2a2a2a; color: #888; padding: 3px 9px; border-radius: 20px; }
.rc2.open .rbdg { border-color: #a07830; color: #d4a853; }
.rbdy { display: none; padding: 10px 16px 14px; border-top: 1px solid #222; }
.rc2.open .rbdy { display: block; }
.rrow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #1a1a1a; cursor: pointer; user-select: none; }
.rrow:last-of-type { border-bottom: none; }
.rbox { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rbox.on { background: #5b9cf6; border-color: #5b9cf6; }
.rbox.on::after { content: "✓"; color: #fff; font-size: 10px; font-weight: 700; }
.rtxt { font-size: 13px; flex: 1; line-height: 1.4; }
.rtxt.done { color: #555; text-decoration: line-through; }
.empty { text-align: center; padding: 40px 20px; color: #555; font-size: 14px; }
#toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #222; border: 1px solid #444; border-radius: 20px; padding: 7px 18px; font-size: 12px; color: #e8e4dc; opacity: 0; pointer-events: none; white-space: nowrap; z-index: 200; transition: opacity 0.25s; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="hdr">
  <h1>Become The Man</h1>
  <span id="streak">🔥 0</span>
</div>
<div id="main">
  <div class="pg on" id="pg-mandala"></div>
  <div class="pg" id="pg-journal"></div>
  <div class="pg" id="pg-tasks"></div>
  <div class="pg" id="pg-fitness"></div>
  <div class="pg" id="pg-readings"></div>
</div>
<div id="tabs">
  <button class="tab on" data-t="mandala"><span class="ti">⬡</span><span>Mandala</span></button>
  <button class="tab" data-t="journal"><span class="ti">📓</span><span>Journal</span></button>
  <button class="tab" data-t="tasks"><span class="ti">✓</span><span>Tasks</span></button>
  <button class="tab" data-t="fitness"><span class="ti">⚖</span><span>Fitness</span></button>
  <button class="tab" data-t="readings"><span class="ti">📖</span><span>Readings</span></button>
</div>
<div id="toast"></div>
<script>
"use strict";
var CATS=[
  {id:"body",icon:"💪",name:"Body",h:["Morning workout","10k steps","Stretch / mobility","No junk food","Sleep 7-8 hrs","Stay hydrated","Cold shower","Track weight"]},
  {id:"mental",icon:"🧠",name:"Mental",h:["10 min meditation","Read 20 min","No doom scrolling","Journaling","Learning session","Positive self-talk","Focus block","Gratitude"]},
  {id:"character",icon:"⚡",name:"Character",h:["Do one hard thing","Help someone","No complaining","Be on time","Follow through on a promise","Own a mistake","Act with integrity","Show up fully"]},
  {id:"life",icon:"🌟",name:"Life / Future",h:["Work on a long-term goal","Review vision / goals","Budget check-in","Save / invest","Plan tomorrow tonight","Research or skill-building","Declutter something","Connect with a mentor"]},
  {id:"education",icon:"📚",name:"Education",h:["Complete assigned readings","Review lecture notes","Do homework on time","Study for 1+ hr","Attend class fully present","Clarify something confusing","Write / draft","Review next week workload"]},
  {id:"karma",icon:"🍀",name:"Karma / Luck",h:["Random act of kindness","Reach out to someone you care about","Volunteer or contribute","Say thank you genuinely","Forgive something small","Give without expectation","Leave things better than found","Pray or set intentions"]},
  {id:"work",icon:"🏆",name:"Work",h:["Hit daily work target","Tackle top priority first","No phone during work blocks","Log hours / tasks","Check in with manager","One above-and-beyond action","No procrastination","End day with clean desk"]},
  {id:"wellbeing",icon:"☀️",name:"Wellbeing",h:["Time outside","Social connection","Do something enjoyable","Limit alcohol","No screens 1hr before bed","Deep breathing / wind-down","Check in with emotions","Self-care ritual"]}
];
var PROMPTS=[
  {id:"win",lbl:"WIN OF THE DAY",q:"What is one thing that went well today, no matter how small?"},
  {id:"lesson",lbl:"LESSON LEARNED",q:"What did you learn today about yourself, others, or the world?"},
  {id:"grateful",lbl:"GRATITUDE",q:"List 3 things you are genuinely grateful for right now."},
  {id:"tomorrow",lbl:"TOMORROW INTENTION",q:"What is the ONE thing you must accomplish tomorrow to move forward?"},
  {id:"reflect",lbl:"REFLECTION",q:"How aligned were your actions today with the man you are becoming?"},
  {id:"growth",lbl:"GROWTH EDGE",q:"Where did you hold back today? What would the best version of you have done?"}
];
var COURSES=[
  {id:"phl113",name:"PHL 113 - Ethics",items:["Introduction to Moral Philosophy","Plato: Euthyphro","Plato: Republic excerpt","Aristotle: Nicomachean Ethics Bk 1","Aristotle: Nicomachean Ethics Bk 2","Aristotle: Nicomachean Ethics Bk 10","Kant: Groundwork for the Metaphysics of Morals","Mill: Utilitarianism","Rawls: A Theory of Justice excerpts"]},
  {id:"phl105",name:"PHL 105 - Critical Thinking",items:["Logic and Argument Structure","Deductive Reasoning","Inductive Reasoning","Fallacies Pt 1","Fallacies Pt 2","Scientific Method","Evaluating Sources","Constructing Arguments","Rhetoric vs Logic"]},
  {id:"phl114",name:"PHL 114 - Eastern Philosophy",items:["Introduction to Eastern Thought","Confucius: Analects","Taoism: Tao Te Ching Pt 1","Taoism: Tao Te Ching Pt 2","Buddhism: The Four Noble Truths","Buddhism: The Eightfold Path","Zen Philosophy","Stoicism meets East","Synthesis and Reflection"]}
];

function G(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function S(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function today(){return new Date().toISOString().split(“T”)[0];}
function fmt(s){return new Date(s+“T12:00:00”).toLocaleDateString(“en-US”,{weekday:“short”,month:“short”,day:“numeric”});}
function shift(s,n){var d=new Date(s+“T12:00:00”);d.setDate(d.getDate()+n);return d.toISOString().split(“T”)[0];}
function esc(s){return String(s).replace(/&/g,”&”).replace(/</g,”<”).replace(/>/g,”>”);}

var mD=today(), jD=today(), filt=“all”, jT={}, rT={}, tT=null;

function toast(m){var e=document.getElementById(“toast”);e.textContent=m;e.classList.add(“on”);clearTimeout(tT);tT=setTimeout(function(){e.classList.remove(“on”);},1800);}

// TABS
document.getElementById(“tabs”).addEventListener(“click”,function(e){
var b=e.target.closest(”.tab”);
if(!b)return;
var t=b.dataset.t;
document.querySelectorAll(”.tab”).forEach(function(x){x.classList.remove(“on”);});
document.querySelectorAll(”.pg”).forEach(function(x){x.classList.remove(“on”);});
b.classList.add(“on”);
document.getElementById(“pg-”+t).classList.add(“on”);
if(t===“fitness”)drawChart();
});

function streak(){
var n=0,d=today();
for(var i=0;i<365;i++){
var h=G(“h_”+d)||{},a=false;
for(var k in h){if(h[k]){a=true;break;}}
if(a){n++;d=shift(d,-1);}else break;
}
document.getElementById(“streak”).textContent=“🔥 “+n;
}

// MANDALA
function mandala(){
var pg=document.getElementById(“pg-mandala”);
var H=G(“h_”+mD)||{};
var done=0,tot=0;
for(var i=0;i<CATS.length;i++)for(var j=0;j<CATS[i].h.length;j++){tot++;if(H[CATS[i].id+”_”+j])done++;}
var pct=tot?Math.round(done/tot*100):0;
var C=144.5,off=C-(C*pct/100);

var html=’<div class="sec">Daily Tracker</div>’
+’<div class="dnav">’
+’<button class="darr" id="mp">‹</button>’
+’<span class="dlbl">’+fmt(mD)+’</span>’
+’<button class="dtbtn" id="mt">Today</button>’
+’<button class="darr" id="mn">›</button>’
+’</div>’
+’<div class="ring-row">’
+’<div class="rw"><svg width="54" height="54" viewBox="0 0 54 54">’
+’<circle cx="27" cy="27" r="23" fill="none" stroke="#2a2a2a" stroke-width="4"/>’
+’<circle cx="27" cy="27" r="23" fill="none" stroke="#d4a853" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'"/>’
+’</svg><div class="rpct">’+pct+’%</div></div>’
+’<div class="rinfo"><div class="rt">Progress</div><div class="rc">’+done+’ / ‘+tot+’ habits</div></div>’
+’</div>’;

for(var ci=0;ci<CATS.length;ci++){
var cat=CATS[ci],cd=0;
for(var hi=0;hi<cat.h.length;hi++)if(H[cat.id+”*”+hi])cd++;
var cp=Math.round(cd/cat.h.length*100);
html+=’<div class=“cc’+(cd===cat.h.length?” gold”:””)+’” id=“cc*’+cat.id+’”>’
+’<button class="chdr" data-cid="'+cat.id+'">’
+’<div class="cleft"><span class="ci">’+cat.icon+’</span><span class="cn">’+cat.name+’</span></div>’
+’<div class="cright"><span class="cpg">’+cd+’/’+cat.h.length+’</span><span class="chv">▼</span></div>’
+’</button>’
+’<div class="pb"><div class="pf" style="width:'+cp+'%"></div></div>’
+’<div class="hl">’;
for(var hi2=0;hi2<cat.h.length;hi2++){
var ck=!!H[cat.id+”_”+hi2];
html+=’<div class="hr" data-cid="'+cat.id+'" data-i="'+hi2+'">’
+’<div class=“hb’+(ck?” on”:””)+’”></div>’
+’<span class=“ht’+(ck?” done”:””)+’”>’+esc(cat.h[hi2])+’</span>’
+’</div>’;
}
html+=’</div></div>’;
}
pg.innerHTML=html;

document.getElementById(“mp”).addEventListener(“click”,function(){mD=shift(mD,-1);mandala();});
document.getElementById(“mn”).addEventListener(“click”,function(){mD=shift(mD,1);mandala();});
document.getElementById(“mt”).addEventListener(“click”,function(){mD=today();mandala();});

pg.querySelectorAll(”.chdr”).forEach(function(b){
b.addEventListener(“click”,function(){document.getElementById(“cc_”+b.dataset.cid).classList.toggle(“open”);});
});
pg.querySelectorAll(”.hr”).forEach(function(r){
r.addEventListener(“click”,function(){
var h=G(“h_”+mD)||{},k=r.dataset.cid+”*”+r.dataset.i;
h[k]=!h[k];S(“h*”+mD,h);mandala();streak();
});
});
}

// JOURNAL
function journal(){
var pg=document.getElementById(“pg-journal”);
var D=G(“j_”+jD)||{};
var html=’<div class="sec">Daily Journal</div>’
+’<div class="dnav">’
+’<button class="darr" id="jp">‹</button>’
+’<span class="dlbl">’+fmt(jD)+’</span>’
+’<button class="dtbtn" id="jt">Today</button>’
+’<button class="darr" id="jn">›</button>’
+’</div>’;
for(var i=0;i<PROMPTS.length;i++){
var p=PROMPTS[i],v=D[p.id]||””;
html+=’<div class="pc" id="pc_'+p.id+'">’
+’<button class="phdr" data-pid="'+p.id+'">’
+’<span class="plbl">’+p.lbl+’</span><span class="chv">▼</span>’
+’</button>’
+’<div class="pbdy"><div class="pq">’+p.q+’</div>’
+’<textarea data-pid="'+p.id+'" placeholder="Write here...">’+esc(v)+’</textarea>’
+’<div class="sind" id="si_'+p.id+'">’+(v?“saved”:””)+’</div>’
+’</div></div>’;
}
pg.innerHTML=html;
document.getElementById(“jp”).addEventListener(“click”,function(){jD=shift(jD,-1);journal();});
document.getElementById(“jn”).addEventListener(“click”,function(){jD=shift(jD,1);journal();});
document.getElementById(“jt”).addEventListener(“click”,function(){jD=today();journal();});
pg.querySelectorAll(”.phdr”).forEach(function(b){
b.addEventListener(“click”,function(){document.getElementById(“pc_”+b.dataset.pid).classList.toggle(“open”);});
});
pg.querySelectorAll(“textarea”).forEach(function(ta){
ta.addEventListener(“input”,function(){
var pid=ta.dataset.pid,si=document.getElementById(“si_”+pid);
si.textContent=“saving…”;si.classList.remove(“ok”);
clearTimeout(jT[pid]);
jT[pid]=setTimeout(function(){
var d=G(“j_”+jD)||{};d[pid]=ta.value;S(“j_”+jD,d);
si.textContent=“saved”;si.classList.add(“ok”);
},700);
});
});
}

// TASKS
function tasks(){
var pg=document.getElementById(“pg-tasks”);
var all=G(“tasks”)||[],list=[];
for(var i=0;i<all.length;i++){
if(filt===“active”&&all[i].done)continue;
if(filt===“done”&&!all[i].done)continue;
if(filt===“high”&&all[i].pri!==“high”)continue;
list.push(all[i]);
}
var html=’<div class="sec">Tasks</div>’
+’<div class="tadd"><input type="text" id="ti" placeholder="Add a task..."><button class="abtn" id="ta">+</button></div>’
+’<select class="psel" id="tpr"><option value="med">Medium priority</option><option value="high">High priority</option><option value="low">Low priority</option></select>’
+’<div class="frow">’;
[“all”,“active”,“done”,“high”].forEach(function(f){
html+=’<div class=“chip’+(filt===f?” on”:””)+’” data-f=”’+f+’”>{’+{all:“All”,active:“Active”,done:“Done”,high:“High”}[f]+’}</div>’;
});
html=html.replace(/{/g,””).replace(/}/g,””)+”</div>”;
if(!list.length){html+=’<div class="empty">No tasks here</div>’;}

function drawChart(){
var cv=document.getElementById(“wc”);if(!cv)return;
var log=(G(“fitness”)||[]).slice(0,14).reverse();
var ctx=cv.getContext(“2d”),dpr=window.devicePixelRatio||1;
var W=Math.max(cv.parentElement.clientWidth-28,100),H=140;
cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+“px”;cv.style.height=H+“px”;
ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
if(!log.length){ctx.fillStyle=”#555”;ctx.font=“12px sans-serif”;ctx.textAlign=“center”;ctx.fillText(“No data yet”,W/2,H/2);return;}
var P={t:8,r:14,b:32,l:42},gW=W-P.l-P.r,gH=H-P.t-P.b,vs=[];
log.forEach(function(e){if(e.am)vs.push(e.am);if(e.pm)vs.push(e.pm);});
if(!vs.length)return;
var mn=Math.floor(Math.min.apply(null,vs)-1),mx=Math.ceil(Math.max.apply(null,vs)+1),rng=mx-mn||1;
function xf(i){return P.l+(i/(log.length-1||1))*gW;}
function yf(v){return P.t+gH-((v-mn)/rng)*gH;}
ctx.strokeStyle=”#1a1a1a”;ctx.lineWidth=1;
for(var t=0;t<=4;t++){var y=P.t+(t/4)*gH;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+gW,y);ctx.stroke();ctx.fillStyle=”#555”;ctx.font=“9px sans-serif”;ctx.textAlign=“right”;ctx.fillText((mx-rng*t/4).toFixed(1),P.l-3,y+3);}
var st=Math.max(1,Math.ceil(log.length/5));
log.forEach(function(e,i){if(i%st!==0&&i!==log.length-1)return;ctx.fillStyle=”#555”;ctx.font=“9px sans-serif”;ctx.textAlign=“center”;ctx.fillText(new Date(e.dt+“T12:00:00”).toLocaleDateString(“en-US”,{month:“short”,day:“numeric”}),xf(i),H-4);});
function ln(g,c){ctx.strokeStyle=c;ctx.lineWidth=2;ctx.lineJoin=“round”;ctx.beginPath();var s=false;log.forEach(function(e,i){var v=g(e);if(!v){s=false;return;}if(!s){ctx.moveTo(xf(i),yf(v));s=true;}else ctx.lineTo(xf(i),yf(v));});ctx.stroke();log.forEach(function(e,i){var v=g(e);if(!v)return;ctx.beginPath();ctx.arc(xf(i),yf(v),3,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();});}
ln(function(e){return e.am;},”#d4a853”);
ln(function(e){return e.pm;},”#5b9cf6”);
}
