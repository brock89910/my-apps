<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Become The Man</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: #0a0a0a;
  color: #e8e4dc;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}

/* HEADER */
#hdr {
flex-shrink: 0;
background: #111111;
border-bottom: 1px solid #2a2a2a;
padding: 50px 16px 12px;
display: flex;
justify-content: space-between;
align-items: center;
}
#hdr h1 { font-size: 20px; font-weight: 800; color: #d4a853; letter-spacing: 1px; }
#streak {
font-size: 12px;
background: rgba(212,168,83,0.1);
border: 1px solid #a07830;
color: #d4a853;
padding: 4px 10px;
border-radius: 20px;
}

/* MAIN SCROLL */
#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* PAGES */
.pg { display: none; padding-bottom: 12px; }
.pg.on { display: block; }

/* TABS */
#tabs {
flex-shrink: 0;
background: #111111;
border-top: 1px solid #2a2a2a;
display: flex;
padding-bottom: env(safe-area-inset-bottom);
}
.tab {
flex: 1;
background: none;
border: none;
color: #555555;
font-size: 10px;
padding: 10px 4px 8px;
cursor: pointer;
display: flex;
flex-direction: column;
align-items: center;
gap: 3px;
}
.tab .ti { font-size: 20px; line-height: 1; }
.tab.on { color: #d4a853; }

/* SECTION LABEL */
.slabel {
font-size: 11px;
font-weight: 700;
letter-spacing: 3px;
color: #555555;
padding: 16px 16px 8px;
text-transform: uppercase;
}

/* DATE NAV */
.dnav {
margin: 0 16px 10px;
background: #161616;
border: 1px solid #2a2a2a;
border-radius: 12px;
padding: 8px 12px;
display: flex;
justify-content: space-between;
align-items: center;
}
.dnav .darrow {
background: none;
border: none;
color: #d4a853;
font-size: 26px;
padding: 0 6px;
cursor: pointer;
line-height: 1;
}
.dnav .dlabel { font-size: 13px; color: #e8e4dc; }
.dnav .dtbtn {
background: rgba(212,168,83,0.1);
border: 1px solid #a07830;
color: #d4a853;
font-size: 11px;
padding: 4px 10px;
border-radius: 8px;
cursor: pointer;
}

/* PROGRESS RING */
.ring-row {
margin: 0 16px 12px;
background: #161616;
border: 1px solid #2a2a2a;
border-radius: 12px;
padding: 14px 16px;
display: flex;
align-items: center;
gap: 14px;
}
.ring-outer {
position: relative;
width: 54px;
height: 54px;
flex-shrink: 0;
}
.ring-outer svg { transform: rotate(-90deg); display: block; }
.ring-pct {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
font-size: 11px;
font-weight: 700;
color: #d4a853;
}
.ring-label .rt {
font-size: 11px;
font-weight: 700;
letter-spacing: 2px;
color: #888888;
text-transform: uppercase;
}
.ring-label .rc { font-size: 14px; color: #e8e4dc; margin-top: 4px; }

/* CATEGORY CARDS */
.ccard {
margin: 0 16px 10px;
background: #161616;
border: 1px solid #2a2a2a;
border-radius: 12px;
overflow: hidden;
}
.ccard.gold { border-color: #a07830; }
.chdr {
display: flex;
justify-content: space-between;
align-items: center;
padding: 13px 16px;
cursor: pointer;
user-select: none;
}
.cleft { display: flex; align-items: center; gap: 10px; }
.cicon { font-size: 18px; }
.cname { font-size: 15px; font-weight: 700; }
.cright { display: flex; align-items: center; gap: 8px; }
.cprog { font-size: 12px; color: #888888; }
.chev { color: #555555; font-size: 12px; display: inline-block; transition: transform 0.2s; }
.ccard.open .chev { transform: rotate(180deg); }
.pbar { height: 2px; background: #2a2a2a; margin: 0 16px; }
.pfill { height: 100%; background: #d4a853; transition: width 0.3s; }
.hlist { display: none; border-top: 1px solid #222222; margin-top: 8px; padding: 4px 0 8px; }
.ccard.open .hlist { display: block; }
.hrow {
display: flex;
align-items: center;
gap: 12px;
padding: 9px 16px;
cursor: pointer;
}
.hbox {
width: 22px;
height: 22px;
border-radius: 6px;
border: 2px solid #333333;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
transition: all 0.15s;
}
.hbox.on { background: #d4a853; border-color: #d4a853; }
.hbox.on::after { content: ‘✓’; color: #000000; font-size: 13px; font-weight: 800; }
.htxt { font-size: 14px; color: #e8e4dc; line-height: 1.4; }
.htxt.done { color: #555555; text-decoration: line-through; }

/* JOURNAL */
.pcard {
margin: 0 16px 10px;
background: #161616;
border: 1px solid #2a2a2a;
border-radius: 12px;
overflow: hidden;
}
.phdr {
display: flex;
justify-content: space-between;
align-items: center;
padding: 13px 16px;
cursor: pointer;
user-select: none;
}
.plbl {
font-size: 13px;
font-weight: 700;
letter-spacing: 1px;
color: #d4a853;
text-transform: uppercase;
}
.pbdy { display: none; padding: 12px 16px 14px; border-top: 1px solid #222222; }
.pcard.open .pbdy { display: block; }
.pq { font-size: 13px; color: #888888; font-style: italic; margin-bottom: 8px; line-height: 1.5; }
textarea {
width: 100%;
background: #1a1a1a;
border: 1px solid #2a2a2a;
border-radius: 10px;
color: #e8e4dc;
font-family: -apple-system, BlinkMacSystemFont, sans-serif;
font-size: 14px;
line-height: 1.6;
padding: 11px;
resize: none;
min-height: 90px;
outline: none;
-webkit-appearance: none;
appearance: none;
display: block;
}
textarea:focus { border-color: #a07830; }
textarea::placeholder { color: #444444; }
.sind {
font-size: 11px;
color: #444444;
text-align: right;
margin-top: 4px;
min-height: 14px;
}
.sind.ok { color: #4caf50; }

/* TASKS */
.tadd { display: flex; gap: 8px; margin: 0 16px 8px; }
.tadd input {
flex: 1;
background: #161616;
border: 1px solid #2a2a2a;
border-radius: 10px;
color: #e8e4dc;
font-family: -apple-system, sans-serif;
font-size: 14px;
padding: 10px 13px;
outline: none;
-webkit-appearance: none;
appearance: none;
}
.tadd input::placeholder { color: #444444; }
.tadd input:focus { border-color: #a07830; }
.abtn {
background: #d4a853;
border: none;
border-radius: 10px;
color: #000000;
font-size: 26px;
font-weight: 700;
width: 44px;
cursor: pointer;
flex-shrink: 0;
line-height: 1;
}
.psel {
display: block;
width: calc(100% - 32px);
margin: 0 16px 8px;
background: #161616;
border: 1px solid #2a2a2a;
border-radius: 10px;
color: #888888;
font-size: 13px;
padding: 9px 12px;
outline: none;
-webkit-appearance: none;
appearance: none;
}
.frow {
display: flex;
gap: 7px;
padding: 0 16px 10px;
overflow-x: auto;
}
.frow::-webkit-scrollbar { display: none; }
.chip {
background: #161616;
border: 1px solid #2a2a2a;
border-radius: 20px;
color: #888888;
font-size: 12px;
padding: 5px 13px;
cursor: pointer;
white-space: nowrap;
flex-shrink: 0;
}
.chip.on { background: rgba(212,168,83,0.1); border-color: #a07830; color: #d4a853; }
.titem {
display: flex;
align-items: flex-start;
gap: 11px;
padding: 12px 14px;
margin: 0 16px 8px;
background: #161616;
border: 1px solid #2a2a2a;
border-radius: 12px;
}
.titem.done { opacity: 0.45; }
.tck {
width: 22px;
height: 22px;
border-radius: 50%;
border: 2px solid #333333;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
flex-shrink: 0;
margin-top: 1px;
transition: all 0.15s;
}
.tck.on { background: #4caf50; border-color: #4caf50; }
.tck.on::after { content: ‘✓’; color: #ffffff; font-size: 12px; font-weight: 700; }
.tbdy { flex: 1; min-width: 0; }
.ttxt { font-size: 14px; color: #e8e4dc; line-height: 1.4; }
.ttxt.done { text-decoration: line-through; color: #555555; }
.tmeta { font-size: 11px; color: #555555; margin-top: 3px; }
.tdel {
background: none;
border: none;
color: #444444;
font-size: 16px;
cursor: pointer;
padding: 0 4px;
line-height: 1;
}

/* FITNESS */
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 16px 10px; }
.wcard { background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; padding: 13px; }
.wlbl {
font-size: 11px;
font-weight: 700;
letter-spacing: 2px;
color: #555555;
text-transform: uppercase;
margin-bottom: 6px;
}
.wrow { display: flex; align-items: center; gap: 6px; }
.win {
flex: 1;
background: #1a1a1a;
border: 1px solid #2a2a2a;
border-radius: 8px;
color: #e8e4dc;
font-size: 18px;
padding: 8px;
outline: none;
width: 100%;
-webkit-appearance: none;
appearance: none;
}
.win:focus { border-color: #a07830; }
.wunit { font-size: 12px; color: #555555; }
.lbtn {
display: block;
width: calc(100% - 32px);
margin: 0 16px 12px;
background: #d4a853;
border: none;
border-radius: 10px;
color: #000000;
font-size: 15px;
font-weight: 700;
letter-spacing: 1px;
padding: 13px;
cursor: pointer;
text-transform: uppercase;
}
.chart-wrap {
margin: 0 16px 12px;
background: #161616;
border: 1px solid #2a2a2a;
border-radius: 12px;
padding: 14px;
}
.chart-ttl {
font-size: 11px;
font-weight: 700;
letter-spacing: 2px;
color: #555555;
text-transform: uppercase;
margin-bottom: 10px;
}
.fhrow {
display: flex;
justify-content: space-between;
padding: 9px 16px;
border-bottom: 1px solid #1a1a1a;
font-size: 12px;
color: #888888;
}
.fhrow:last-child { border-bottom: none; }

/* READINGS */
.rcard {
margin: 0 16px 10px;
background: #161616;
border: 1px solid #2a2a2a;
border-radius: 12px;
overflow: hidden;
}
.rhdr {
display: flex;
justify-content: space-between;
align-items: center;
padding: 13px 16px;
cursor: pointer;
user-select: none;
}
.rcrs { font-size: 14px; font-weight: 700; }
.rbdg {
font-size: 11px;
background: #1a1a1a;
border: 1px solid #2a2a2a;
color: #888888;
padding: 3px 9px;
border-radius: 20px;
flex-shrink: 0;
}
.rcard.open .rbdg { border-color: #a07830; color: #d4a853; }
.rbdy { display: none; padding: 10px 16px 14px; border-top: 1px solid #222222; }
.rcard.open .rbdy { display: block; }
.rrow {
display: flex;
align-items: center;
gap: 10px;
padding: 7px 0;
border-bottom: 1px solid #1a1a1a;
cursor: pointer;
}
.rrow:last-of-type { border-bottom: none; }
.rbox {
width: 18px;
height: 18px;
border-radius: 4px;
border: 2px solid #333333;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
transition: all 0.15s;
}
.rbox.on { background: #5b9cf6; border-color: #5b9cf6; }
.rbox.on::after { content: ‘✓’; color: #ffffff; font-size: 10px; font-weight: 700; }
.rtxt { font-size: 13px; color: #e8e4dc; flex: 1; line-height: 1.4; }
.rtxt.done { color: #555555; text-decoration: line-through; }
.rnotes { margin-top: 10px; min-height: 70px; }

/* EMPTY */
.empty { text-align: center; padding: 40px 20px; color: #555555; font-size: 14px; }

/* TOAST */
#toast {
position: fixed;
bottom: 80px;
left: 50%;
transform: translateX(-50%) translateY(16px);
background: #1a1a1a;
border: 1px solid #333333;
border-radius: 20px;
padding: 7px 18px;
font-size: 12px;
color: #e8e4dc;
opacity: 0;
transition: all 0.25s;
pointer-events: none;
white-space: nowrap;
z-index: 999;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

</head>
<body>

<div id="hdr">
  <h1>Become The Man</h1>
  <span id="streak">🔥 0</span>
</div>

<div id="main">
  <div class="pg on" id="pg-mandala"></div>
  <div class="pg" id="pg-journal"></div>
  <div class="pg" id="pg-tasks"></div>
  <div class="pg" id="pg-fitness"></div>
  <div class="pg" id="pg-readings"></div>
</div>

<div id="tabs">
  <button class="tab on" data-t="mandala"><span class="ti">⬡</span><span>Mandala</span></button>
  <button class="tab" data-t="journal"><span class="ti">📓</span><span>Journal</span></button>
  <button class="tab" data-t="tasks"><span class="ti">✓</span><span>Tasks</span></button>
  <button class="tab" data-t="fitness"><span class="ti">⚖</span><span>Fitness</span></button>
  <button class="tab" data-t="readings"><span class="ti">📖</span><span>Readings</span></button>
</div>

<div id="toast"></div>

<script>
"use strict";

// ── DATA ──────────────────────────────────────────────────────────────────────

var CATS = [
  { id: "body", icon: "💪", name: "Body", habits: [
    "Morning workout / movement", "10k steps", "Stretch or mobility work",
    "No junk food", "Sleep 7-8 hrs", "Stay hydrated", "Cold shower", "Track weight"
  ]},
  { id: "mental", icon: "🧠", name: "Mental", habits: [
    "10 min meditation / breathwork", "Read 20 min", "No doom scrolling",
    "Journaling", "Learning session", "Positive self-talk", "Focus block", "Gratitude"
  ]},
  { id: "character", icon: "⚡", name: "Character", habits: [
    "Do one hard thing", "Help someone", "No complaining",
    "Be on time", "Follow through on a promise", "Own a mistake", "Act with integrity", "Show up fully"
  ]},
  { id: "life", icon: "🌟", name: "Life / Future", habits: [
    "Work on a long-term goal", "Review vision / goals", "Budget check-in",
    "Save / invest", "Plan tomorrow tonight", "Research or skill-building", "Declutter something", "Connect with a mentor"
  ]},
  { id: "education", icon: "📚", name: "Education", habits: [
    "Complete assigned readings", "Review lecture notes", "Do homework on time",
    "Study for 1+ hr", "Attend class fully present", "Clarify something confusing", "Write / draft", "Review next week workload"
  ]},
  { id: "karma", icon: "🍀", name: "Karma / Luck", habits: [
    "Random act of kindness", "Reach out to someone you care about", "Volunteer or contribute",
    "Say thank you genuinely", "Forgive something small", "Give without expectation", "Leave things better than found", "Pray or set intentions"
  ]},
  { id: "work", icon: "🏆", name: "Work", habits: [
    "Hit daily work target", "Tackle top priority first", "No phone during work blocks",
    "Log hours / tasks", "Check in with team or manager", "One above-and-beyond action", "No procrastination on tough task", "End day with clean desk"
  ]},
  { id: "wellbeing", icon: "☀️", name: "Wellbeing", habits: [
    "Time outside", "Social connection", "Do something enjoyable",
    "Limit alcohol", "No screens 1hr before bed", "Deep breathing / wind-down", "Check in with emotions", "Self-care ritual"
  ]}
];

var PROMPTS = [
  { id: "win",      lbl: "WIN OF THE DAY",        q: "What is one thing that went well today, no matter how small?" },
  { id: "lesson",   lbl: "LESSON LEARNED",         q: "What did you learn today about yourself, others, or the world?" },
  { id: "grateful", lbl: "GRATITUDE",              q: "List 3 things you are genuinely grateful for right now." },
  { id: "tomorrow", lbl: "TOMORROW INTENTION",     q: "What is the ONE thing you must accomplish tomorrow to move forward?" },
  { id: "reflect",  lbl: "REFLECTION",             q: "How aligned were your actions today with the man you are becoming?" },
  { id: "growth",   lbl: "GROWTH EDGE",            q: "Where did you hold back today? What would the best version of you have done?" }
];

var COURSES = [
  { id: "phl113", name: "PHL 113 — Ethics", items: [
    "Introduction to Moral Philosophy", "Plato – Euthyphro", "Plato – Republic excerpt",
    "Aristotle – Nicomachean Ethics Bk 1", "Aristotle – Nicomachean Ethics Bk 2", "Aristotle – Nicomachean Ethics Bk 10",
    "Kant – Groundwork for the Metaphysics of Morals", "Mill – Utilitarianism", "Rawls – A Theory of Justice excerpts"
  ]},
  { id: "phl105", name: "PHL 105 — Critical Thinking", items: [
    "Logic and Argument Structure", "Deductive Reasoning", "Inductive Reasoning",
    "Fallacies Pt 1", "Fallacies Pt 2", "Scientific Method", "Evaluating Sources",
    "Constructing Arguments", "Rhetoric vs Logic"
  ]},
  { id: "phl114", name: "PHL 114 — Eastern Philosophy", items: [
    "Introduction to Eastern Thought", "Confucius – Analects", "Taoism – Tao Te Ching Pt 1",
    "Taoism – Tao Te Ching Pt 2", "Buddhism – The Four Noble Truths", "Buddhism – The Eightfold Path",
    "Zen Philosophy", "Stoicism meets East", "Synthesis and Reflection"
  ]}
];

// ── STORAGE ───────────────────────────────────────────────────────────────────

function lsGet(k) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
  catch (e) { return null; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); }
  catch (e) {}
}

// ── DATE HELPERS ──────────────────────────────────────────────────────────────

function todayStr() {
  return new Date().toISOString().split("T")[0];
}
function fmtDate(s) {
  var d = new Date(s + "T12:00:00");
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
function addDays(s, n) {
  var d = new Date(s + "T12:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().split("T")[0];
}
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ── STATE ─────────────────────────────────────────────────────────────────────

var mDate = todayStr();
var jDate = todayStr();
var tFilter = "all";
var jTimers = {};
var rTimers = {};
var toastTimer = null;

// ── TOAST ─────────────────────────────────────────────────────────────────────

function showToast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove("on"); }, 1800);
}

// ── TABS ──────────────────────────────────────────────────────────────────────

document.getElementById("tabs").addEventListener("click", function (e) {
  var btn = e.target.closest(".tab");
  if (!btn) return;
  var t = btn.dataset.t;
  document.querySelectorAll(".tab").forEach(function (b) { b.classList.remove("on"); });
  document.querySelectorAll(".pg").forEach(function (p) { p.classList.remove("on"); });
  btn.classList.add("on");
  document.getElementById("pg-" + t).classList.add("on");
  if (t === "fitness") drawChart();
});

// ── STREAK ────────────────────────────────────────────────────────────────────

function updateStreak() {
  var streak = 0;
  var d = todayStr();
  for (var i = 0; i < 365; i++) {
    var h = lsGet("h_" + d) || {};
    var any = false;
    var keys = Object.keys(h);
    for (var j = 0; j < keys.length; j++) { if (h[keys[j]]) { any = true; break; } }
    if (any) { streak++; d = addDays(d, -1); } else { break; }
  }
  document.getElementById("streak").textContent = "🔥 " + streak;
}

// ── MANDALA ───────────────────────────────────────────────────────────────────

function renderMandala() {
  var pg = document.getElementById("pg-mandala");
  var H = lsGet("h_" + mDate) || {};
  var done = 0, total = 0;
  for (var ci = 0; ci < CATS.length; ci++) {
    for (var hi = 0; hi < CATS[ci].habits.length; hi++) {
      total++;
      if (H[CATS[ci].id + "_" + hi]) done++;
    }
  }
  var pct = total ? Math.round(done / total * 100) : 0;
  var circ = 144.5;
  var offset = circ - (circ * pct / 100);

  var html = "";
  html += '<div class="slabel">Daily Tracker</div>';
  html += '<div class="dnav">';
  html += '<button class="darrow" id="mprev">&#8249;</button>';
  html += '<span class="dlabel">' + fmtDate(mDate) + "</span>";
  html += '<button class="dtbtn" id="mtoday">Today</button>';
  html += '<button class="darrow" id="mnext">&#8250;</button>';
  html += "</div>";

  html += '<div class="ring-row">';
  html += '<div class="ring-outer">';
  html += '<svg width="54" height="54" viewBox="0 0 54 54">';
  html += '<circle cx="27" cy="27" r="23" fill="none" stroke="#2a2a2a" stroke-width="4"/>';
  html += '<circle cx="27" cy="27" r="23" fill="none" stroke="#d4a853" stroke-width="4" stroke-linecap="round" stroke-dasharray="' + circ + '" stroke-dashoffset="' + offset + '"/>';
  html += "</svg>";
  html += '<div class="ring-pct">' + pct + "%</div>";
  html += "</div>";
  html += '<div class="ring-label"><div class="rt">Progress</div><div class="rc">' + done + " / " + total + " habits</div></div>";
  html += "</div>";

  for (var ci2 = 0; ci2 < CATS.length; ci2++) {
    var cat = CATS[ci2];

var l = getFit();
var t = todayStr();

for (var i = 0; i < l.length; i++) {

}

function drawChart() {
var canvas = document.getElementById(“wc”);
if (!canvas) return;
var log = getFit().slice(0, 14).reverse();
var ctx = canvas.getContext(“2d”);
var dpr = window.devicePixelRatio || 1;
var W = Math.max(canvas.parentElement.clientWidth - 28, 200);
var H = 140;
canvas.width = W * dpr;
canvas.height = H * dpr;
canvas.style.width = W + “px”;
canvas.style.height = H + “px”;
ctx.scale(dpr, dpr);
ctx.clearRect(0, 0, W, H);

if (!log.length) {
ctx.fillStyle = “#555”;
ctx.font = “12px sans-serif”;
ctx.textAlign = “center”;
ctx.fillText(“No data yet”, W / 2, H / 2);
return;
}

var PAD = { t: 8, r: 14, b: 32, l: 42 };
var gW = W - PAD.l - PAD.r;
var gH = H - PAD.t - PAD.b;
var vals = [];
for (var i = 0; i < log.length; i++) {
if (log[i].am) vals.push(log[i].am);
if (log[i].pm) vals.push(log[i].pm);
}
if (!vals.length) return;
var mn = Math.floor(Math.min.apply(null, vals) - 1);
var mx = Math.ceil(Math.max.apply(null, vals) + 1);
var rng = mx - mn || 1;

function xOf(i) { return PAD.l + (i / (log.length - 1 || 1)) * gW; }
function yOf(v) { return PAD.t + gH - ((v - mn) / rng) * gH; }

ctx.strokeStyle = “#1a1a1a”;
ctx.lineWidth = 1;
for (var t = 0; t <= 4; t++) {
var y = PAD.t + (t / 4) * gH;
ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(PAD.l + gW, y); ctx.stroke();
ctx.fillStyle = “#555”; ctx.font = “9px sans-serif”; ctx.textAlign = “right”;
ctx.fillText((mx - rng * t / 4).toFixed(1), PAD.l - 3, y + 3);
}

var step = Math.max(1, Math.ceil(log.length / 5));
for (var i = 0; i < log.length; i++) {
if (i % step !== 0 && i !== log.length - 1) continue;
var d2 = new Date(log[i].date + “T12:00:00”);
ctx.fillStyle = “#555”; ctx.font = “9px sans-serif”; ctx.textAlign = “center”;
ctx.fillText(d2.toLocaleDateString(“en-US”, { month: “short”, day: “numeric” }), xOf(i), H - 4);
}

function drawLine(getter, color) {
ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = “round”;
ctx.beginPath();
var started = false;
for (var i = 0; i < log.length; i++) {
var v = getter(log[i]);
if (!v) { started = false; continue; }
if (!started) { ctx.moveTo(xOf(i), yOf(v)); started = true; } else { ctx.lineTo(xOf(i), yOf(v)); }
}
ctx.stroke();
for (var i = 0; i < log.length; i++) {
var v = getter(log[i]);
if (!v) continue;
ctx.beginPath(); ctx.arc(xOf(i), yOf(v), 3, 0, Math.PI * 2);
ctx.fillStyle = color; ctx.fill();
}
}

drawLine(function (e) { return e.am; }, “#d4a853”);
drawLine(function (e) { return e.pm; }, “#5b9cf6”);
}
