<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Become The Man</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --gold: #d4a853;
  --gold-dim: #a07830;
  --gold-bg: #1a0f00;
  --bg: #0a0a0a;
  --bg2: #111111;
  --bg3: #161616;
  --bg4: #1e1e1e;
  --border: #252525;
  --border2: #333333;
  --text: #e8e4dc;
  --text2: #aaa;
  --text3: #666;
  --green: #4caf50;
  --blue: #5b9cf6;
  --red: #e05c5c;
  --orange: #f0a040;
  --purple: #a78bfa;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bot: env(safe-area-inset-bottom, 20px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); }
body { font-family: 'DM Sans', sans-serif; color: var(--text); display: flex; flex-direction: column; }
.bebas { font-family: 'Bebas Neue', sans-serif; }
.mono { font-family: 'DM Mono', monospace; }

/* HEADER */
#hdr {
  flex-shrink: 0;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: calc(var(--safe-top) + 8px) 16px 12px;
  display: flex; justify-content: space-between; align-items: center;
  position: relative; z-index: 10;
}
#hdr-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); letter-spacing: 2px; }
#hdr-right { display: flex; align-items: center; gap: 10px; }
#streak-badge {
  font-family: 'DM Mono', monospace; font-size: 12px;
  color: var(--gold); background: var(--gold-bg);
  border: 1px solid var(--gold-dim); padding: 4px 10px; border-radius: 20px;
}
#date-badge {
  font-family: 'DM Mono', monospace; font-size: 11px;
  color: var(--text3); background: var(--bg3);
  border: 1px solid var(--border); padding: 4px 9px; border-radius: 20px;
}

/* MAIN SCROLL */
#main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

/* BOTTOM TABS */
#tabs {
  flex-shrink: 0; background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex; padding-bottom: var(--safe-bot);
  position: relative; z-index: 10;
}
.tab {
  flex: 1; background: none; border: none; color: var(--text3);
  font-size: 9px; font-family: 'DM Sans', sans-serif; font-weight: 500;
  padding: 10px 2px 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: color 0.2s; letter-spacing: 0.5px; text-transform: uppercase;
}
.tab .ti { font-size: 19px; line-height: 1; }
.tab.on { color: var(--gold); }

/* PAGES */
.pg { display: none; padding-bottom: 20px; min-height: 100%; }
.pg.on { display: block; }

/* SECTION LABELS */
.sec-lbl {
  font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 3px;
  color: var(--text3); padding: 16px 16px 8px; text-transform: uppercase;
}

/* CALENDAR STRIP */
.cal-strip {
  display: flex; overflow-x: auto; gap: 6px; padding: 8px 16px 12px;
  scrollbar-width: none;
}
.cal-strip::-webkit-scrollbar { display: none; }
.cal-day {
  flex-shrink: 0; width: 44px; height: 54px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 12px;
  cursor: pointer; gap: 2px; transition: all 0.15s;
}
.cal-day .cd-dow { font-size: 10px; color: var(--text3); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.cal-day .cd-num { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--text2); line-height: 1; }
.cal-day.on { background: var(--gold-bg); border-color: var(--gold-dim); }
.cal-day.on .cd-num { color: var(--gold); }
.cal-day.on .cd-dow { color: var(--gold-dim); }
.cal-day.today .cd-num { color: var(--text); }

/* ============ MANDALA PAGE ============ */
.mandala-wrap { padding: 0 12px 16px; overflow-x: auto; }
.mandala-grid {
  display: grid; grid-template-columns: repeat(9, 1fr);
  gap: 3px; min-width: 320px;
}
.mc {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  text-align: center; font-size: 8px; line-height: 1.2; font-weight: 500;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 5px;
  cursor: pointer; padding: 3px; position: relative; transition: all 0.15s;
  color: var(--text2); user-select: none;
}
.mc:active { transform: scale(0.94); }
.mc.center {
  background: linear-gradient(135deg, #2a1800, #1a0f00);
  border: 2px solid var(--gold);
  font-family: 'Bebas Neue', sans-serif; font-size: 10px;
  color: var(--gold); letter-spacing: 0.5px;
}
.mc.cat-label {
  background: var(--bg4); border-color: var(--border2);
  font-family: 'Bebas Neue', sans-serif; font-size: 9px;
  color: var(--text); letter-spacing: 0.5px;
}
.mc.complete { background: #0d2010; border-color: #2a5a2a; color: var(--green); }
.mc.partial { background: #1a1200; border-color: #4a3800; color: var(--orange); }
.mc.missed { background: #200a0a; border-color: #5a2020; color: var(--red); }
.mc.complete::after { content: "✓"; position: absolute; top: 2px; right: 3px; font-size: 7px; color: var(--green); }
.mc.partial::after { content: "⚡"; position: absolute; top: 2px; right: 3px; font-size: 6px; color: var(--orange); }
.mc.missed::after { content: "✕"; position: absolute; top: 2px; right: 3px; font-size: 7px; color: var(--red); }

/* Category progress cards */
.cat-progress-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 8px; }
.cat-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 12px;
}
.cat-card-name { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 5px; }
.cat-card-bar { height: 3px; background: var(--border2); border-radius: 2px; margin-bottom: 4px; }
.cat-card-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s; }
.cat-card-pct { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--gold); }

/* BOTTOM SHEET MODAL */
#modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 100; display: none; backdrop-filter: blur(4px);
}
#modal-overlay.on { display: flex; align-items: flex-end; }
#modal-sheet {
  background: var(--bg2); border-top: 1px solid var(--border2);
  border-radius: 20px 20px 0 0; width: 100%; padding: 12px 20px calc(var(--safe-bot) + 20px);
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 16px; }
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--text); letter-spacing: 1px; margin-bottom: 4px; }
.modal-cat { font-size: 11px; color: var(--text3); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
.modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mbtn {
  padding: 14px; border: 1px solid var(--border2); border-radius: 12px;
  background: var(--bg3); color: var(--text2); font-size: 13px; font-weight: 600;
  cursor: pointer; text-align: center; transition: all 0.15s;
}
.mbtn:active { transform: scale(0.96); }
.mbtn.complete-btn { border-color: var(--green); color: var(--green); }
.mbtn.partial-btn { border-color: var(--orange); color: var(--orange); }
.mbtn.missed-btn { border-color: var(--red); color: var(--red); }
.mbtn.clear-btn { border-color: var(--border2); color: var(--text3); }

/* ============ TASKS PAGE ============ */
.filter-row { display: flex; gap: 6px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.fchip {
  flex-shrink: 0; padding: 5px 12px; border-radius: 20px;
  background: var(--bg3); border: 1px solid var(--border); color: var(--text3);
  font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.5px;
}
.fchip.on { background: var(--gold-bg); border-color: var(--gold-dim); color: var(--gold); }

.task-item {
  display: flex; align-items: flex-start; gap: 12px;
  margin: 0 12px 6px; padding: 12px 13px;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 12px;
  transition: opacity 0.2s;
}
.task-item.done-item { opacity: 0.45; }
.task-status-btn {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border2);
  flex-shrink: 0; margin-top: 1px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; transition: all 0.15s; background: none;
}
.task-body { flex: 1; min-width: 0; }
.task-name { font-size: 14px; font-weight: 500; line-height: 1.4; }
.task-name.done { text-decoration: line-through; color: var(--text3); }
.task-meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.type-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.task-type-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
.task-time { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; }
.task-due { font-size: 10px; color: var(--orange); font-family: 'DM Mono', monospace; }
.task-del { background: none; border: none; color: var(--border2); font-size: 18px; cursor: pointer; padding: 0 2px; flex-shrink: 0; }
.task-del:active { color: var(--red); }

/* Status colors */
.s-notstarted { border-color: var(--border2); color: transparent; }
.s-inprogress { border-color: var(--blue); background: rgba(91,156,246,0.15); color: var(--blue); }
.s-done { border-color: var(--green); background: var(--green); color: #fff; }
.s-next { border-color: var(--purple); background: rgba(167,139,250,0.15); color: var(--purple); }
.s-skipped { border-color: var(--text3); background: rgba(100,100,100,0.15); color: var(--text3); }

.add-task-row { display: flex; gap: 8px; margin: 0 12px 8px; }
.add-task-input {
  flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px;
  padding: 10px 13px; outline: none;
}
.add-task-input:focus { border-color: var(--gold-dim); }
.add-task-input::placeholder { color: var(--text3); }
.add-task-btn {
  background: var(--gold); border: none; border-radius: 10px;
  color: #000; font-size: 22px; font-weight: 700; width: 44px; cursor: pointer;
}
.type-select {
  display: block; width: calc(100% - 24px); margin: 0 12px 10px;
  background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text2); font-size: 13px; padding: 9px 12px; outline: none;
}

/* ============ FITNESS PAGE ============ */
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 12px 10px; }
.stat-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
.stat-label { font-size: 9px; font-weight: 700; letter-spacing: 2px; color: var(--text3); text-transform: uppercase; margin-bottom: 4px; }
.stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--gold); line-height: 1; }
.stat-unit { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); }

.weight-input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 10px; }
.w-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.w-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
.w-input-row { display: flex; align-items: center; gap: 6px; }
.w-input {
  flex: 1; background: var(--bg4); border: 1px solid var(--border2); border-radius: 8px;
  color: var(--text); font-family: 'DM Mono', monospace; font-size: 18px;
  padding: 8px; outline: none; width: 100%; text-align: center;
}
.w-unit { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
.log-btn {
  display: block; width: calc(100% - 24px); margin: 0 12px 12px;
  background: var(--gold); border: none; border-radius: 10px;
  color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px;
  padding: 13px; cursor: pointer;
}

.chart-card { margin: 0 12px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.chart-title { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--text3); text-transform: uppercase; margin-bottom: 10px; }
.range-row { display: flex; gap: 6px; margin-bottom: 10px; }
.rbtn {
  padding: 4px 10px; border-radius: 8px; background: var(--bg4); border: 1px solid var(--border);
  color: var(--text3); font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'DM Mono', monospace;
}
.rbtn.on { background: var(--gold-bg); border-color: var(--gold-dim); color: var(--gold); }

.history-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
.history-row:last-child { border-bottom: none; }
.history-date { color: var(--text2); font-family: 'DM Mono', monospace; }
.history-vals { color: var(--text3); font-family: 'DM Mono', monospace; font-size: 11px; }

/* ============ READINGS PAGE ============ */
.overall-progress { margin: 0 12px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.op-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.op-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--text3); text-transform: uppercase; }
.op-pct { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gold); }
.op-bar { height: 4px; background: var(--border2); border-radius: 2px; }
.op-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.5s; }

.course-card { margin: 0 12px 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.course-hdr {
  display: flex; justify-content: space-between; align-items: center;
  padding: 13px 16px; cursor: pointer; user-select: none;
  background: none; border: none; width: 100%; color: inherit; text-align: left;
}
.course-name { font-family: 'Bebas Neue', sans-serif; font-size: 16px; color: var(--text); letter-spacing: 1px; }
.course-badge {
  font-family: 'DM Mono', monospace; font-size: 11px;
  background: var(--bg4); border: 1px solid var(--border2); color: var(--text3);
  padding: 3px 9px; border-radius: 20px;
}
.course-card.open .course-badge { border-color: var(--gold-dim); color: var(--gold); }
.course-prog { height: 2px; background: var(--border); }
.course-prog-fill { height: 100%; background: var(--gold); transition: width 0.4s; }
.course-body { display: none; padding: 8px 0 12px; border-top: 1px solid var(--border); }
.course-card.open .course-body { display: block; }
.reading-row {
  display: flex; align-items: flex-start; gap: 10px; padding: 8px 16px;
  cursor: pointer; user-select: none;
}
.reading-row:active { background: var(--bg4); }
.rcheck {
  width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--border2);
  flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center;
}
.rcheck.on { background: var(--blue); border-color: var(--blue); }
.rcheck.on::after { content: "✓"; color: #fff; font-size: 10px; font-weight: 700; }
.reading-title { font-size: 13px; line-height: 1.4; flex: 1; }
.reading-title.done { color: var(--text3); text-decoration: line-through; }
.reading-author { font-size: 11px; color: var(--text3); }

/* TOAST */
#toast {
  position: fixed; bottom: calc(var(--safe-bot) + 70px); left: 50%;
  transform: translateX(-50%); background: var(--bg4); border: 1px solid var(--border2);
  border-radius: 20px; padding: 8px 18px; font-size: 12px; color: var(--text);
  opacity: 0; pointer-events: none; white-space: nowrap; z-index: 200;
  transition: opacity 0.2s; font-weight: 500;
}
#toast.on { opacity: 1; }

/* EMPTY */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
</style>
</head>
<body>

<div id="hdr">
  <span id="hdr-title">BECOME THE MAN</span>
  <div id="hdr-right">
    <span id="date-badge"></span>
    <span id="streak-badge">🔥 0</span>
  </div>
</div>

<div id="main">
  <!-- MANDALA -->
  <div class="pg on" id="pg-mandala">
    <div class="sec-lbl">Mandala Chart</div>
    <div id="cal-mandala"></div>
    <div class="mandala-wrap">
      <div class="mandala-grid" id="mandala-grid"></div>
    </div>
    <div class="sec-lbl">Category Progress</div>
    <div class="cat-progress-grid" id="cat-progress"></div>
  </div>

  <!-- TASKS -->
  <div class="pg" id="pg-tasks">
    <div class="sec-lbl">Assignments</div>
    <div class="add-task-row">
      <input type="text" class="add-task-input" id="task-input" placeholder="Add assignment...">
      <button class="add-task-btn" id="task-add-btn">+</button>
    </div>
    <select class="type-select" id="task-type-sel">
      <option value="Admin">Admin</option>
      <option value="Bills">Bills</option>
      <option value="Email">Email</option>
      <option value="Inventory">Inventory</option>
      <option value="Reservations">Reservations</option>
      <option value="Outside">Outside</option>
    </select>
    <div class="filter-row" id="task-filters"></div>
    <div id="task-list"></div>
  </div>

  <!-- FITNESS -->
  <div class="pg" id="pg-fitness">
    <div class="sec-lbl">Weight Log</div>
    <div id="cal-fitness"></div>
    <div class="stats-row" id="fit-stats"></div>
    <div class="weight-input-grid">
      <div class="w-card">
        <div class="w-label">Morning</div>
        <div class="w-input-row">
          <input type="number" step="0.1" class="w-input" id="wt-am" placeholder="0.0">
          <span class="w-unit">kg</span>
        </div>
      </div>
      <div class="w-card">
        <div class="w-label">Night</div>
        <div class="w-input-row">
          <input type="number" step="0.1" class="w-input" id="wt-pm" placeholder="0.0">
          <span class="w-unit">kg</span>
        </div>
      </div>
    </div>
    <button class="log-btn" id="log-btn">LOG WEIGHT</button>
    <div class="chart-card">
      <div class="chart-title">AM vs PM Trend</div>
      <div class="range-row" id="chart-range"></div>
      <canvas id="wt-chart" height="140"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-title">Daily Difference (PM − AM)</div>
      <canvas id="diff-chart" height="100"></canvas>
    </div>
    <div class="sec-lbl">History</div>
    <div id="fit-history"></div>
  </div>

  <!-- READINGS -->
  <div class="pg" id="pg-readings">
    <div class="sec-lbl">Philosophy Readings</div>
    <div class="overall-progress">
      <div class="op-row">
        <span class="op-label">Overall Progress</span>
        <span class="op-pct" id="op-pct">0%</span>
      </div>
      <div class="op-bar"><div class="op-fill" id="op-fill" style="width:0%"></div></div>
    </div>
    <div id="readings-list"></div>
  </div>
</div>

<div id="tabs">
  <button class="tab on" data-t="mandala"><span class="ti">⬡</span><span>Mandala</span></button>
  <button class="tab" data-t="tasks"><span class="ti">✓</span><span>Tasks</span></button>
  <button class="tab" data-t="fitness"><span class="ti">◉</span><span>Fitness</span></button>
  <button class="tab" data-t="readings"><span class="ti">📚</span><span>Readings</span></button>
</div>

<div id="modal-overlay">
  <div id="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-cat" id="modal-cat"></div>
    <div class="modal-btns">
      <button class="mbtn complete-btn" id="mb-complete">✅ Complete</button>
      <button class="mbtn partial-btn" id="mb-partial">⚡ Not 100%</button>
      <button class="mbtn missed-btn" id="mb-missed">✖ Missed</button>
      <button class="mbtn clear-btn" id="mb-clear">○ Clear</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";

// ===================== DATA =====================
var CATS = [
  {id:"body", name:"Body", items:[

// Mandala 9x9 layout matching Ohtani method exactly
// 9 blocks of 3x3: corners+edges = 8 categories, center = "Become The Man"
// Cat blocks: TL(0-2,0-2)=body, TM(0-2,3-5)=mental, TR(0-2,6-8)=life
//             ML(3-5,0-2)=character, CENTER(3-5,3-5)=center, MR(3-5,6-8)=education
//             BL(6-8,0-2)=karma, BM(6-8,3-5)=work, BR(6-8,6-8)=env
// Within each 3x3 block: center cell = cat label, surrounding 8 = items
var MANDALA_LAYOUT = (function(){
  var grid = [];
  for(var r=0;r<9;r++){grid.push([]);for(var c=0;c<9;c++)grid[r].push(null);}

  // Center block = "Become The Man"
  grid[4][4] = {type:'center'};
  // Center block surrounding 8 = category labels pointing outward
  var centerRing = [
    [3,3,'body'],[3,4,'mental'],[3,5,'life'],
    [4,3,'character'],[4,5,'education'],
    [5,3,'karma'],[5,4,'work'],[5,5,'env']
  ];
  centerRing.forEach(function(x){grid[x[0]][x[1]]={type:'cat',catId:x[2]};});

  // Each category block: its center cell is also cat label, surrounding 8 are items
  var blocks = [
    {id:'body',     br:0, bc:0},
    {id:'mental',   br:0, bc:3},
    {id:'life',     br:0, bc:6},
    {id:'character',br:3, bc:0},
    {id:'education',br:3, bc:6},
    {id:'karma',    br:6, bc:0},
    {id:'work',     br:6, bc:3},
    {id:'env',      br:6, bc:6}
  ];
  blocks.forEach(function(b){
    // Center of this 3x3 block = cat label
    grid[b.br+1][b.bc+1] = {type:'cat', catId:b.id};
    // Surrounding 8 = items, order: top-left reading order skipping center
    var itemIdx=0;
    var order=[[0,0],[0,1],[0,2],[1,0],[1,2],[2,0],[2,1],[2,2]];
    order.forEach(function(o){
      var r=b.br+o[0], c=b.bc+o[1];
      grid[r][c]={type:'item',catId:b.id,itemIdx:itemIdx};
      itemIdx++;
    });
  });

  return grid;
})();

function G(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}

function today(){return new Date().toISOString().split("T")[0];}
function shiftDate(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().split("T")[0];}
function fmtDate(s){return new Date(s+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});}
function fmtShort(s){var d=new Date(s+"T12:00:00");return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

}

// ===================== CALENDAR STRIP =====================
function buildCalStrip(containerId, selectedDate, onSelect){
  var container = document.getElementById(containerId);
  var html = '';
  var td = today();
  for(var i=-6;i<=0;i++){
    var d=shiftDate(td,i);
    var dt=new Date(d+"T12:00:00");
    var dow=dt.toLocaleDateString("en-US",{weekday:"short"}).toUpperCase();
    var num=dt.getDate();
    var cls="cal-day"+(d===selectedDate?" on":"")+(d===td?" today":"");
    html+='<div class="'+cls+'" data-d="'+d+'"><span class="cd-dow">'+dow+'</span><span class="cd-num">'+num+'</span></div>';
  }
  container.innerHTML='<div class="cal-strip">'+html+'</div>';
  container.querySelectorAll(".cal-day").forEach(function(el){
    el.addEventListener("click",function(){onSelect(el.dataset.d);});
  });
}

        continue;

      if(cell.type==='center'){
        html+='<div class="mc center">BECOME<br>THE MAN</div>';

      if(cell.type==='cat'){
        var cn=catMap[cell.catId].name;
        html+='<div class="mc cat-label">'+esc(cn)+'</div>';
        continue;
      }
      // item
      var cat=catMap[cell.catId];
      var itemTxt=cat.items[cell.itemIdx]||"";
      var key=cell.catId+"_"+cell.itemIdx;
      var st=H[key]||"";
      var stCls=st==="complete"?" complete":st==="partial"?" partial":st==="missed"?" missed":"";
      html+='<div class="mc'+stCls+'" data-key="'+key+'" data-cat="'+cell.catId+'" data-item="'+cell.itemIdx+'" data-txt="'+esc(itemTxt)+'">'+esc(itemTxt)+'</div>';

  // Click handlers
  grid.querySelectorAll(".mc[data-key]").forEach(function(el){

  });

  renderCatProgress(H);
  updateHeader();
}

function renderCatProgress(H){

      if(H[cat.id+"_"+i]==="complete")done++;

    var pct=total?Math.round(done/total*100):0;
    html+='<div class="cat-card">'
      +'<div class="cat-card-name">'+esc(cat.name)+'</div>'
      +'<div class="cat-card-bar"><div class="cat-card-fill" style="width:'+pct+'%"></div></div>'
      +'<div class="cat-card-pct">'+pct+'%</div>'
      +'</div>';

}

var taskFilter = "All";
var FILTERS = ["All","Bills","Reservations","Inventory","Email","Admin","Outside","Done","Skipped"];
var STATUS_CYCLE = {notstarted:"inprogress", inprogress:"done", done:"next", next:"skipped", skipped:"notstarted"};
var STATUS_LABELS = {notstarted:"○",inprogress:"▶",done:"✓",next:"→",skipped:"—"};
var STATUS_CSS = {notstarted:"s-notstarted",inprogress:"s-inprogress",done:"s-done",next:"s-next",skipped:"s-skipped"};

function renderTasks(){
  // Filters
  var fhtml='';
  FILTERS.forEach(function(f){
    fhtml+='<div class="fchip'+(taskFilter===f?" on":"")+'" data-f="'+f+'">'+f+'</div>';
  });
  document.getElementById("task-filters").innerHTML=fhtml;
  document.querySelectorAll("#task-filters .fchip").forEach(function(c){
    c.addEventListener("click",function(){taskFilter=c.dataset.f;renderTasks();});
  });

  var tasks=G("tasks")||[];
  var filtered=tasks.filter(function(t){
    if(taskFilter==="All")return true;
    if(taskFilter==="Done")return t.status==="done";
    if(taskFilter==="Skipped")return t.status==="skipped";
    return t.type===taskFilter;
  });

  if(!filtered.length){document.getElementById("task-list").innerHTML='<div class="empty-state">No tasks here</div>';return;}

  var html='';
  filtered.forEach(function(t){
    var tc=TASK_TYPES[t.type]||{color:"#888"};
    var sc=STATUS_CSS[t.status]||"s-notstarted";
    var sl=STATUS_LABELS[t.status]||"○";
    var isDone=t.status==="done"||t.status==="skipped";
    html+='<div class="task-item'+(isDone?" done-item":"")+'" data-id="'+t.id+'">'
      +'<button class="task-status-btn '+sc+'" data-id="'+t.id+'">'+sl+'</button>'
      +'<div class="task-body">'
      +'<div class="task-name'+(isDone?" done":"")+'">'+esc(t.name)+'</div>'
      +'<div class="task-meta">'
      +'<div class="type-dot" style="background:'+tc.color+'"></div>'
      +'<span class="task-type-lbl" style="color:'+tc.color+'">'+esc(t.type)+'</span>'
      +(t.time?'<span class="task-time">'+esc(t.time)+'</span>':'')
      +(t.due?'<span class="task-due">Due: '+esc(t.due)+'</span>':'')
      +'</div></div>'
      +'<button class="task-del" data-id="'+t.id+'">×</button>'
      +'</div>';
  });
  document.getElementById("task-list").innerHTML=html;

  document.querySelectorAll(".task-status-btn").forEach(function(btn){
    btn.addEventListener("click",function(e){
      e.stopPropagation();
      var id=Number(btn.dataset.id), arr=G("tasks")||[];
      for(var i=0;i<arr.length;i++){
        if(arr[i].id===id){
          arr[i].status=STATUS_CYCLE[arr[i].status]||"notstarted";
          break;
        }
      }
      S("tasks",arr); renderTasks();
    });
  });
  document.querySelectorAll(".task-del").forEach(function(btn){
    btn.addEventListener("click",function(){
      var id=Number(btn.dataset.id), arr=G("tasks")||[];
      S("tasks",arr.filter(function(t){return t.id!==id;}));
      renderTasks(); toast("Removed");
    });
  });
}

function renderFitnessStats(){

  var sorted=log.slice().sort(function(a,b){return a.dt<b.dt?1:-1;});
  var latest=sorted[0];
  var prev=sorted[1];

  var cur=latest?(latest.pm||latest.am||"—"):"—";
  var chg="—";
  if(latest&&prev){
    var a=latest.am||latest.pm, b=prev.am||prev.pm;
    if(a&&b){var diff=(parseFloat(a)-parseFloat(b)).toFixed(1);chg=(diff>0?"+":"")+diff;}

  var days=log.length;

    labels:labels,
    datasets:[
      {label:"AM",data:amVals,borderColor:"#5b9cf6",backgroundColor:"rgba(91,156,246,0.08)",tension:0.3,pointRadius:3,pointBackgroundColor:"#5b9cf6",spanGaps:true},
      {label:"PM",data:pmVals,borderColor:"#e05c5c",backgroundColor:"rgba(224,92,92,0.08)",tension:0.3,pointRadius:3,pointBackgroundColor:"#e05c5c",spanGaps:true}
    ]
  },options:opts});

  if(diffChart){diffChart.destroy();}
  var ctx2=document.getElementById("diff-chart").getContext("2d");
  diffChart=new Chart(ctx2,{type:"bar",data:{
    labels:labels,
    datasets:[{
      label:"PM−AM",data:diffVals,
      backgroundColor:diffVals.map(function(v){return v&&v>0?"rgba(224,92,92,0.7)":"rgba(91,156,246,0.7)";}),
      borderRadius:3
    }]
  },options:Object.assign({},opts,{plugins:Object.assign({},opts.plugins,{legend:{display:false}})})});
}

function renderFitHistory(){
  var log=(G("fitness")||[]).slice().sort(function(a,b){return a.dt<b.dt?1:-1;}).slice(0,20);
  if(!log.length){document.getElementById("fit-history").innerHTML='<div class="empty-state">No entries yet</div>';return;}
  var html='<div style="margin:0 12px; background:var(--bg3);border:1px solid var(--border);border-radius:12px;overflow:hidden">';
  log.forEach(function(e){
    var diff=(e.am&&e.pm)?((parseFloat(e.pm)-parseFloat(e.am)).toFixed(1)):"";
    html+='<div class="history-row">'
      +'<span class="history-date">'+fmtShort(e.dt)+'</span>'
      +'<span class="history-vals">AM:'+(e.am||"—")+'  PM:'+(e.pm||"—")+(diff?' <span style="color:'+(diff>0?"var(--red)":"var(--green)")+'">'+( diff>0?"+":"")+diff+'</span>':'')+'</span>'
      +'</div>';
  });
  html+='</div>';
  document.getElementById("fit-history").innerHTML=html;
}

document.getElementById("log-btn").addEventListener("click",function(){
  var am=parseFloat(document.getElementById("wt-am").value)||null;
  var pm=parseFloat(document.getElementById("wt-pm").value)||null;
  if(!am&&!pm){toast("Enter a weight");return;}
  var log=G("fitness")||[], found=false;
  for(var i=0;i<log.length;i++){
    if(log[i].dt===fitDate){log[i]={dt:fitDate,am:am,pm:pm};found=true;break;}
  }
  if(!found)log.unshift({dt:fitDate,am:am,pm:pm});
  S("fitness",log);
  renderFitness(); toast("Logged ✓");
});

// ===================== READINGS =====================
function renderReadings(){
  var D=G("readings")||{};
  var total=0, done=0;
  COURSES.forEach(function(c){c.items.forEach(function(item,i){total++;if(D[c.id+"_"+i])done++;});});
  var pct=total?Math.round(done/total*100):0;
  document.getElementById("op-pct").textContent=pct+"%";
  document.getElementById("op-fill").style.width=pct+"%";

  var html='';
  COURSES.forEach(function(c){
    var cd=0;
    c.items.forEach(function(item,i){if(D[c.id+"_"+i])cd++;});
    var cpct=Math.round(cd/c.items.length*100);
    html+='<div class="course-card" id="cr_'+c.id+'">'
      +'<button class="course-hdr" data-cid="'+c.id+'">'
      +'<span class="course-name">'+esc(c.name)+'</span>'
      +'<span class="course-badge">'+cd+'/'+c.items.length+'</span>'
      +'</button>'
      +'<div class="course-prog"><div class="course-prog-fill" style="width:'+cpct+'%"></div></div>'
      +'<div class="course-body">';
    c.items.forEach(function(item,i){
      var ck=!!D[c.id+"_"+i];
      html+='<div class="reading-row" data-cid="'+c.id+'" data-i="'+i+'">'
        +'<div class="rcheck'+(ck?" on":"")+'"></div>'
        +'<div><div class="reading-title'+(ck?" done":"")+'">'+esc(item.title)+'</div>'
        +'<div class="reading-author">'+esc(item.author)+'</div></div>'
        +'</div>';
    });
    html+='</div></div>';
  });
  document.getElementById("readings-list").innerHTML=html;

  document.querySelectorAll(".course-hdr").forEach(function(b){
    b.addEventListener("click",function(){document.getElementById("cr_"+b.dataset.cid).classList.toggle("open");});
  });
  document.querySelectorAll(".reading-row").forEach(function(r){
    r.addEventListener("click",function(){
      var D=G("readings")||{}, k=r.dataset.cid+"_"+r.dataset.i;
      D[k]=!D[k]; S("readings",D); renderReadings();
    });
  });
}

// ===================== BOOT =====================
updateHeader();
renderMandala();
renderTasks();
</script>
